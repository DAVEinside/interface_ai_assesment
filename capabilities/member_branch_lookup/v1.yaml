schema_version: pcx.capability/1.0
id: member_branch_lookup
version: 1
title: Member Branch Lookup
description: Look up member {{ inputs.member_number }} in the CoreServ member inquiry screen and read
  back their member name and the branch they belong to.
created_at: '2026-09-10T01:19:24.568801+00:00'
created_by_run: discovery-20260909T211825-bd85
discovered_with_model: claude-sonnet-4-5-20250929
author: llm_discovery
surface:
  kind: web
  adapter: pcx.surfaces.web:WebSurface
  app:
    vendor: Meridian Data Systems
    product: CoreServ Teller Workstation
    version: '7.2'
  entrypoint: '{{ tenant.base_url }}/desk'
  viewport:
  - 1280
  - 800
contract:
  summary: Look up member {{ inputs.member_number }} in the CoreServ member inquiry screen and read back
    their member name and the branch they belong to.
  inputs:
  - name: member_number
    type: string
    description: Member Number (8 digits).
    required: true
    pattern: \d{8}
    sensitivity: pii_reference
  outputs:
  - name: member_name
    type: string
    description: Member Name.
    required: true
    sensitivity: pii
  - name: branch
    type: string
    description: Branch.
    required: true
    sensitivity: internal
  outcomes:
  - code: OK
    kind: success
    description: The flow completed and every declared output was captured.
    terminal: true
    retryable: false
    remediation: ''
  - code: MEMBER_NOT_FOUND
    kind: business
    description: 'The member number is well-formed but no such record exists on the member file. A legitimate
      answer to a lookup, not an error.

      '
    detect:
      text_matches: MBR-404
    terminal: true
    retryable: false
    remediation: Confirm the member number with the caller; try a name search instead.
  - code: VALIDATION_ERROR
    kind: business
    description: 'The application rejected the supplied input before doing any work (wrong length, non-numeric,
      amount below product minimum).

      '
    detect:
      text_matches: MBR-00[0-9]|AMT-[0-9]{3}
    terminal: true
    retryable: false
    remediation: Correct the input and re-invoke. Retrying unchanged will not help.
  - code: PERMISSION_DENIED
    kind: denied
    description: 'The record carries an advisory hold, or the signed-on operator''s role is not authorized
      for this function. Distinct from NOT_FOUND: the record exists and the caller may not see it.

      '
    detect:
      text_matches: SEC-40[0-9]|PERMISSION DENIED
    terminal: true
    retryable: false
    remediation: Route to a supervisor or to Compliance; do not retry with the same operator.
  side_effect: read_only
  idempotent: true
  typical_duration_ms: 30720
steps:
- id: s1
  intent: I can see the main menu with 'MEMBER INQUIRY' option available on the left. I need to click
    on it to access the member inquiry screen where I can look up member {{ inputs.member_number }}.
  action: click
  target:
    description: link 'MEMBER INQUIRY'
    strategies:
    - kind: role_name
      role: link
      name: MEMBER INQUIRY
      note: Accessible name -- the most portable identity available.
    - kind: label
      role: link
      anchor_text: FUNCTIONS
      direction: below
      max_distance: 420.0
      region: navframe
      note: The control immediately below of the label 'FUNCTIONS'. This product does not associate labels
        with inputs, so adjacency is the only semantic link available -- and it is the same link a human
        uses.
    - kind: text
      role: link
      text: MEMBER INQUIRY
      note: Visible label text.
    - kind: ordinal
      role: link
      region: navframe
      index: 0
      note: Positional fallback. If this is the strategy that fires, the screen has changed and the capability
        should be reviewed.
    verify:
      role: link
      name_pattern: MEMBER\ INQUIRY
      enabled: true
      min_confidence: 0.45
    on_ambiguity: fail
    recorded:
      role: link
      name: MEMBER INQUIRY
      region: navframe
      rect:
        x: 3.0
        y: 60.20000076293945
        w: 114.61250305175781
        h: 14.39999771118164
  parse: raw
  expect:
    route_matches: ^/desk$
  expect_navigation: true
  signature_hint: sig_2abe72c1f62fc5f1
  risk: safe
  optional: false
  retry:
    attempts: 2
    backoff_ms: 750
    settle_ms: 300
  timeout_ms: 15000
