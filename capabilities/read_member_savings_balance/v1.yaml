  target:
    description: unlabelled textbox
    strategies:
    - kind: label
      role: textbox
      anchor_text: 'MEMBER NUMBER:'
      direction: right
      max_distance: 420.0
      region: workframe
      note: The control immediately right of the label 'MEMBER NUMBER:'. This product does not associate
        labels with inputs, so adjacency is the only semantic link available -- and it is the same link
        a human uses.
    - kind: label
      role: textbox
      anchor_text: MEMBER INQUIRY
      direction: below
      max_distance: 420.0
      region: workframe
      note: The control immediately below of the label 'MEMBER INQUIRY'. This product does not associate
        labels with inputs, so adjacency is the only semantic link available -- and it is the same link
        a human uses.
    - kind: ordinal
      role: textbox
      region: workframe
      index: 0
      note: Positional fallback. If this is the strategy that fires, the screen has changed and the capability
        should be reviewed.
    verify:
      role: textbox
      editable: true
      enabled: true
      min_confidence: 0.45
    on_ambiguity: fail
    recorded:
      role: textbox
      name: ''
      region: workframe
      rect:
        x: 333.625
        y: 52.0
        w: 104.0
        h: 15.0
  value: '{{ inputs.member_number }}'
  parse: raw
  expect_navigation: false
  signature_hint: sig_2abe72c1f62fc5f1
  risk: safe
  optional: false
  retry:
    attempts: 2
    backoff_ms: 750
    settle_ms: 300
  timeout_ms: 15000
