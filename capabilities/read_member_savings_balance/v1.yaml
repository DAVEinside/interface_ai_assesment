recovery:
  interstitials:
  - name: system_notice
    when:
      all_of:
      - text_present: SYSTEM NOTICE
      - text_present: ACKNOWLEDGE
    dismiss:
    - id: ack_notice
      intent: Acknowledge the maintenance notice
      action: click
      target:
        description: ACKNOWLEDGE button on the notice screen
        strategies:
        - kind: role_name
          role: button
          name: ACKNOWLEDGE
        verify:
          role: button
          enabled: true
          min_confidence: 0.45
        on_ambiguity: fail
      parse: raw
      expect_navigation: false
      risk: safe
      optional: false
      retry:
        attempts: 2
        backoff_ms: 750
        settle_ms: 300
      timeout_ms: 15000
    max_occurrences: 2
    note: 'Broadcast maintenance banner. Can appear before any screen, at any point in a flow, and must
      be acknowledged before the underlying screen renders.

      '
  transient:
  - name: slow_host_response
    when:
      any_of:
      - text_present: PLEASE WAIT
      - text_present: PROCESSING
    max_occurrences: 4
    note: 'The core host link stalls under load. The page eventually renders; the correct response is
      to wait and re-observe, not to re-submit -- a re-submit on a write flow would double-post.

      '
  session_expired:
    any_of:
    - text_matches: CSV-440
    - all_of:
      - text_present: OPERATOR SIGN ON
      - text_present: OPERATOR ID
  reauth_capability: sign_on_coreserv
  hard_error:
    any_of:
    - text_matches: CSV-500
    - text_present: CORESERV SYSTEM ERROR
