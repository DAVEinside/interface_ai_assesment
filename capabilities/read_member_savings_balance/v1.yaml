- id: s4
  intent: The inquiry is complete showing SHARE SAVINGS balance <savings_balance> (e35) and member name
    <member_name> (e13); I'll extract the savings balance first.
  action: extract
  target:
    description: cell located by label from 'SHARE SAVINGS'
    strategies:
    - kind: label
      role: cell
      anchor_text: SHARE SAVINGS
      direction: right
      max_distance: 420.0
      region: workframe
      note: The control immediately right of the label 'SHARE SAVINGS'. This product does not associate
        labels with inputs, so adjacency is the only semantic link available -- and it is the same link
        a human uses.
    - kind: label
      role: cell
      anchor_text: CURRENT BALANCE
      direction: below
      max_distance: 420.0
      region: workframe
      note: The control immediately below of the label 'CURRENT BALANCE'. This product does not associate
        labels with inputs, so adjacency is the only semantic link available -- and it is the same link
        a human uses.
    - kind: row_cell
      role: cell
      anchor_text: SHARE SAVINGS
      rank: 0
      column_header: CURRENT BALANCE
      region: workframe
      note: Read the value at the intersection of the row identified by 'SHARE SAVINGS' and the 'CURRENT
        BALANCE' column.
    - kind: row_cell
      role: cell
      text_pattern: ^-?\(?\$?[0-9][0-9,]*\.[0-9]{2}\)?$
      anchor_text: SHARE SAVINGS
      rank: 0
      region: workframe
      note: Same row, first cell matching the expected value shape.
    - kind: ordinal
      role: cell
      region: workframe
      index: 22
      note: Positional fallback. If this is the strategy that fires, the screen has changed and the capability
        should be reviewed.
    verify:
      role: cell
      text_pattern: ^-?\(?\$?[0-9][0-9,]*\.[0-9]{2}\)?$
      enabled: true
      min_confidence: 0.45
    on_ambiguity: fail
    recorded:
      role: cell
      region: workframe
      rect:
        x: 411.59375
        y: 160.0
        w: 100.5625
        h: 15.0
  bind: savings_balance
  parse: money
  expect_navigation: false
  signature_hint: sig_c68985f8331cb3b6
