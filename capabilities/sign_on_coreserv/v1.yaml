schema_version: pcx.capability/1.0
id: sign_on_coreserv
version: 1
title: Sign On Coreserv
description: Sign on to the CoreServ teller workstation with the supplied operator credentials. Stop once
  the workstation main screen with the left-hand function menu is displayed.
created_at: '2026-09-09T04:10:38.029155+00:00'
created_by_run: discovery-20260909T034502-6b08
discovered_with_model: sonnet
author: llm_discovery
surface:
  kind: web
  adapter: pcx.surfaces.web:WebSurface
  app:
    vendor: Meridian Data Systems
    product: CoreServ Teller Workstation
    version: '7.2'
  entrypoint: '{{ tenant.base_url }}/'
  viewport:
  - 1280
  - 800
contract:
  summary: Sign on to the CoreServ teller workstation with the supplied operator credentials. Stop once
    the workstation main screen with the left-hand function menu is displayed.
  inputs:
  - name: operator_id
    type: string
    description: Operator Id.
    required: true
    sensitivity: pii_reference
  - name: operator_password
    type: string
    description: Operator Password.
    required: true
    sensitivity: secret
  outputs:
  - name: signed_on_operator
    type: string
    description: Signed On Operator.
    required: true
    sensitivity: internal
  outcomes:
  - code: OK
    kind: success
    description: The flow completed and every declared output was captured.
    terminal: true
    retryable: false
    remediation: ''
  - code: MEMBER_NOT_FOUND
    kind: business
    description: 'The member number is well-formed but no such record exists on the member file. A legitimate
      answer to a lookup, not an error.

      '
    detect:
      text_matches: MBR-404
    terminal: true
    retryable: false
    remediation: Confirm the member number with the caller; try a name search instead.
  - code: VALIDATION_ERROR
    kind: business
    description: 'The application rejected the supplied input before doing any work (wrong length, non-numeric,
      amount below product minimum).

      '
    detect:
      text_matches: MBR-00[0-9]|AMT-[0-9]{3}
    terminal: true
    retryable: false
    remediation: Correct the input and re-invoke. Retrying unchanged will not help.
  - code: PERMISSION_DENIED
    kind: denied
    description: 'The record carries an advisory hold, or the signed-on operator''s role is not authorized
      for this function. Distinct from NOT_FOUND: the record exists and the caller may not see it.

      '
    detect:
      text_matches: SEC-40[0-9]|PERMISSION DENIED
    terminal: true
    retryable: false
    remediation: Route to a supervisor or to Compliance; do not retry with the same operator.
  side_effect: reversible_write
  idempotent: false
  typical_duration_ms: 35700
