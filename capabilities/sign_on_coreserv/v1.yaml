  intent: I see the sign-on screen with Operator ID and Password fields; I'll click the Operator ID field
    first to type into it.
  action: type
  target:
    description: unlabelled textbox
    strategies:
    - kind: label
      role: textbox
      anchor_text: 'OPERATOR ID:'
      direction: right
      max_distance: 420.0
      region: main
      note: The control immediately right of the label 'OPERATOR ID:'. This product does not associate
        labels with inputs, so adjacency is the only semantic link available -- and it is the same link
        a human uses.
    - kind: label
      role: textbox
      anchor_text: OPERATOR SIGN ON
      direction: below
      max_distance: 420.0
      region: main
      note: The control immediately below of the label 'OPERATOR SIGN ON'. This product does not associate
        labels with inputs, so adjacency is the only semantic link available -- and it is the same link
        a human uses.
    - kind: ordinal
      role: textbox
      region: main
      index: 0
      note: Positional fallback. If this is the strategy that fires, the screen has changed and the capability
        should be reviewed.
    verify:
      role: textbox
      editable: true
      enabled: true
      min_confidence: 0.45
    on_ambiguity: fail
    recorded:
      role: textbox
      name: ''
      region: main
      rect:
        x: 520.984375
        y: 112.0
        w: 120.0
        h: 15.0
  value: '{{ inputs.operator_id }}'
