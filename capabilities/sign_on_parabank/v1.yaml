schema_version: pcx.capability/1.0
id: sign_on_parabank
version: 1
title: Sign On Parabank
description: Sign in to ParaBank with the supplied customer credentials. Stop once the Accounts Overview
  page is displayed.
created_at: '2026-09-10T20:03:07.797350+00:00'
created_by_run: discovery-20260910T160233-0430
discovered_with_model: claude-sonnet-4-5-20250929
author: llm_discovery
surface:
  kind: web
  adapter: pcx.surfaces.web:WebSurface
  app:
    vendor: Parasoft
    product: ParaBank
    version: '3.0'
  entrypoint: '{{ tenant.base_url }}/parabank/index.htm'
  viewport:
  - 1280
  - 800
contract:
  summary: Sign in to ParaBank with the supplied customer credentials. Stop once the Accounts Overview
    page is displayed.
  inputs:
  - name: username
    type: string
    description: Username.
    required: true
    sensitivity: pii_reference
  - name: password
    type: string
    description: Password.
    required: true
    sensitivity: secret
  outputs:
  - name: signed_in_customer
    type: string
    description: Signed In Customer.
    required: true
    sensitivity: internal
  outcomes:
  - code: OK
    kind: success
    description: The flow completed and every declared output was captured.
    terminal: true
    retryable: false
    remediation: ''
  - code: INVALID_CREDENTIALS
    kind: denied
    description: 'The username and password were not accepted. Distinct from a locked or absent account:
      ParaBank does not distinguish those publicly.

      '
    detect:
      any_of:
      - text_present: The username and password could not be verified
      - text_present: Please enter a username and password
    terminal: true
    retryable: false
    remediation: Check the credentials. Do not retry -- repeated attempts will not succeed.
  - code: ACCOUNT_NOT_FOUND
    kind: business
    description: 'The account number is well-formed but is not one of the signed-in customer''s accounts.
      A legitimate answer to a lookup.

      '
    detect:
      any_of:
      - text_present: Could not find account
      - text_present: The account does not exist
    terminal: true
    retryable: false
    remediation: Confirm the account number belongs to this customer.
  - code: VALIDATION_ERROR
    kind: business
    description: 'The form was rejected before any work was done -- a missing required field, a non-numeric
      amount, or an amount the account cannot cover.

      '
    detect:
      any_of:
      - text_present: is required
      - text_present: Please enter a valid amount
      - text_present: The amount cannot be greater than
      - text_present: Invalid amount
    terminal: true
    retryable: false
    remediation: Correct the input and re-invoke. Retrying unchanged will not help.
  - code: NO_TRANSACTIONS_FOUND
    kind: business
    description: 'A transaction search that ran correctly and matched nothing. Emphatically not an error
      -- a caller that treats it as one will retry forever.

      '
    detect:
      text_present: No transactions found
    terminal: true
    retryable: false
    remediation: Widen the date range or amount, or accept the empty result.
  side_effect: reversible_write
  idempotent: false
  typical_duration_ms: 30330
