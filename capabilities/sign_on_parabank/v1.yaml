      - text_present: Please wait
      - text_present: 503 Service
      - text_present: Service Temporarily Unavailable
    max_occurrences: 4
    note: 'ParaBank is a shared public instance and is periodically slow or briefly unavailable while
      its demo database is reset. Waiting is correct; re- submitting a transfer or a bill payment is not,
      because a re-submit on a write flow double-posts.

      '
