[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pcx"
version = "0.1.0"
description = "Progressive crystallization: LLM discovery -> typed capability artifact -> deterministic replay"
requires-python = ">=3.11"
dependencies = [
  "playwright>=1.45",
  "pydantic>=2.7",
  "pyyaml>=6.0",
  "pillow>=10.0",
  "httpx>=0.27",
  "fastapi>=0.110",
  "uvicorn>=0.29",
  "flask>=3.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
pcx = "pcx.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src", "."]
testpaths = ["tests"]