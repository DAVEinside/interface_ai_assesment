<html><head><title>OPEN SUB-ACCOUNT</title></head>
<body bgcolor="#ffffff" text="#000000">
<table width="100%" cellpadding="2" cellspacing="0" border="0">
 <tr><td bgcolor="#808080"><font face="Arial" size="2" color="#ffffff"><b>&nbsp;OPEN SUB-ACCOUNT</b></font></td></tr>
</table>
<br>
<form method="POST" action="/subacct" name="frmSub">
<input type="hidden" name="stage" value="review">
<table cellpadding="4" cellspacing="0" border="0">
 <tr><td align="right"><font face="Arial" size="2">MEMBER NUMBER:</font></td>
     <td><input type="text" name="f1" id="ctl00_wf_txt7" size="12" maxlength="8" value="{{ member_number }}" style="font-family:Courier New"></td></tr>
 <tr><td align="right"><font face="Arial" size="2">PRODUCT:</font></td>
     <td><select name="f2" id="ctl00_wf_ddl1" style="font-family:Courier New">
       {% for suffix, label in types %}<option value="{{ suffix }}">{{ suffix }} - {{ label }}</option>{% endfor %}
     </select></td></tr>
 <tr><td align="right"><font face="Arial" size="2">INITIAL DEPOSIT:</font></td>
     <td><input type="text" name="f3" id="ctl00_wf_txt8" size="12" style="font-family:Courier New"></td></tr>
 <tr><td>&nbsp;</td><td><input type="submit" value="REVIEW" style="font-family:Arial;font-size:11px;width:90px"></td></tr>
</table>
</form>
{% if error %}
<table cellpadding="4" cellspacing="0" border="1" bgcolor="#ffe0e0"><tr><td>
<font face="Courier New" size="2" color="#a00000"><b>{{ error }}</b></font>
</td></tr></table>
{% endif %}
</body></html>
