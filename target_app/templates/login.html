<html>
<head><title>CoreServ 7.2 - Operator Sign On</title></head>
<body bgcolor="#c0c0c0" text="#000000" link="#000080" vlink="#000080">
<table width="100%" cellpadding="0" cellspacing="0" border="0">
 <tr><td bgcolor="#000080"><font face="Arial" size="2" color="#ffffff"><b>&nbsp;MERIDIAN CREDIT UNION&nbsp;&nbsp;|&nbsp;&nbsp;CoreServ 7.2.114 &nbsp;|&nbsp; TELLER WORKSTATION</b></font></td></tr>
</table>
<br><br>
<center>
<table border="2" cellpadding="10" cellspacing="0" bgcolor="#d4d0c8" width="480">
 <tr><td>
  <table width="100%" cellpadding="0" cellspacing="0" border="0">
   <tr><td bgcolor="#808080"><font face="Arial" size="2" color="#ffffff"><b>&nbsp;OPERATOR SIGN ON</b></font></td></tr>
  </table>
  <br>
  <form method="POST" action="/" name="frmSignon">
  <table cellpadding="4" cellspacing="0" border="0">
   <tr>
    <td align="right"><font face="Arial" size="2">OPERATOR ID:</font></td>
    <td><input type="text" name="f1" id="ctl00_so_txt1" size="14" maxlength="12" style="font-family:Courier New"></td>
   </tr>
   <tr>
    <td align="right"><font face="Arial" size="2">PASSWORD:</font></td>
    <td><input type="password" name="f2" id="ctl00_so_txt2" size="14" maxlength="32" style="font-family:Courier New"></td>
   </tr>
   <tr>
    <td>&nbsp;</td>
    <td><input type="submit" value="SIGN ON" style="font-family:Arial;font-size:11px;width:90px">&nbsp;<input type="reset" value="CLEAR" style="font-family:Arial;font-size:11px;width:90px"></td>
   </tr>
  </table>
  </form>
  {% if error %}<font face="Courier New" size="2" color="#a00000"><b>{{ error }}</b></font><br>{% endif %}
  {% if expired %}<font face="Courier New" size="2" color="#a00000"><b>CSV-440&nbsp;&nbsp;SESSION EXPIRED - PLEASE SIGN ON AGAIN</b></font><br>{% endif %}
 </td></tr>
</table>
<br><font face="Arial" size="1">UNAUTHORIZED ACCESS PROHIBITED. ACTIVITY IS LOGGED AND MONITORED.</font>
</center>
</body></html>
